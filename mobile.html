<!-- 安順國中教師活動簽到手機二合一頁面 V1.6.1183；強制 ZXing 一維條碼解碼、提高相機理想解析度；搭配教師人事系統 V1.6.1180、Apps Script V1.3.41。 -->
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><title>安順國中｜手機教師活動簽到助手</title>
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/index.min.js"></script>
<style>
:root{--navy:#17324d;--blue:#245b86;--green:#16734a;--red:#b42318;--muted:#64748b;--line:#dbe3ea}
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#172b45;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:14px}
main{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 28px rgba(22,42,60,.08)}
h1{font-size:21px;margin:0 0 5px;color:var(--navy)}p{line-height:1.6;color:#475569}.small{font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:#e8f5ee;color:var(--green)}
.tabs{display:flex;gap:8px;margin:16px 0 12px}.tab{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:#f7f9fb;color:var(--navy);font-weight:800;font-size:15px}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.panel[hidden]{display:none!important}#reader{width:100%;min-height:240px;border-radius:14px;overflow:hidden;background:#111;margin:12px 0}#reader video{object-fit:contain!important;background:#111}
button.action{width:100%;padding:13px;border:0;border-radius:11px;background:var(--navy);color:white;font-size:16px;font-weight:750;margin-top:9px}button.secondary{background:#edf2f7;color:#263a50;border:1px solid #d8e0e9}button:disabled{opacity:.45}
#status{padding:12px;border-radius:10px;background:#f2f6fa;color:#34465a;margin-top:14px;white-space:pre-wrap;line-height:1.55}#status.good{background:#e8f5ee;color:#17633d}#status.bad{background:#fff0ef;color:#a32119}
.voiceOrb{width:112px;height:112px;border-radius:50%;background:#eaf3fc;color:#245b86;display:flex;align-items:center;justify-content:center;font-size:48px;margin:18px auto 10px}.voiceOrb.live{background:#e8f5ee;color:#16734a;box-shadow:0 0 0 8px #e8f5ee88}
#recognized{min-height:30px;text-align:center;font-size:18px;font-weight:800;color:var(--navy);margin:10px 0}
</style></head>
<body><main>
<span class="pill">同一手機介面</span><h1>教師活動簽到助手</h1>
<p>可切換語音辨識或身分證條碼掃描。簽到比對仍由電腦上的教師人事系統處理。</p>
<div class="tabs"><button class="tab active" id="voiceTab" type="button">🎙️ 語音簽到</button><button class="tab" id="scanTab" type="button">▦ 身分證掃描</button></div>
<section class="panel" id="voicePanel">
 <div class="voiceOrb" id="voiceOrb">🎙️</div><div id="recognized">尚未開始辨識</div>
 <button class="action" id="voiceStart" type="button">開始語音辨識</button>
 <button class="action secondary" id="voiceStop" type="button" hidden>停止辨識</button>
 <p class="small">請清楚說出一位教師的姓名。辨識結果會傳回電腦，由活動正式名冊比對；不會直接依語音文字自行判定身分。</p>
</section>
<section class="panel" id="scanPanel" hidden>
 <p>請使用手機後置相機，掃描臺灣國民身分證背面的統一編號條碼。掃描資料會先在手機端加密，再傳回電腦比對。</p>
 <div id="reader"></div>
 <button class="action" id="scanStart" type="button">啟動相機掃描</button>
 <button class="action secondary" id="scanNext" type="button" hidden>掃描下一位教師</button>
 <button class="action secondary" id="scanStop" type="button">結束相機</button>
 <p class="small">本頁不保存掃描照片，也不會把完整身分證號寫入活動試算表。</p>
</section>
<div id="status" role="status" aria-live="polite">正在檢查配對資訊…</div>
<p class="small">語音辨識使用手機瀏覽器支援的語音服務；若瀏覽器不支援，請改用最新版 Android Chrome。配對有效時間約 4 分鐘。</p>
<iframe name="relaySink" id="relaySink" title="簽到安全傳送通道" hidden></iframe>
</main>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);const params=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
const sessionToken=String(params.get('s')||'').toLowerCase(),keyHex=String(params.get('k')||'').toLowerCase(),relayUrl=String(params.get('r')||''),eventId=String(params.get('e')||'').toLowerCase();
let scanner=null,scannerRunning=false,scanBusy=false,recognition=null,voiceRunning=false;
function status(msg,kind){$('status').textContent=msg;$('status').className=kind||'';}
let scanStartedAt=0,scanDiagTimer=null,decodeCount=0;
function validParams(){return /^[a-f0-9]{48}$/.test(sessionToken)&&/^[a-f0-9]{64}$/.test(keyHex)&&/^[a-f0-9]{32}$/.test(eventId)&&/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\?/.test(relayUrl);}
function submitFields(fields){const form=document.createElement('form');form.method='POST';form.target='relaySink';form.action=relayUrl;Object.entries({event:eventId,sessionToken,...fields}).forEach(([name,value])=>{const input=document.createElement('input');input.type='hidden';input.name=name;input.value=String(value??'');form.appendChild(input);});document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),1200);}
function switchMode(mode){const voice=mode==='voice';$('voicePanel').hidden=!voice;$('scanPanel').hidden=voice;$('voiceTab').classList.toggle('active',voice);$('scanTab').classList.toggle('active',!voice);if(voice&&scannerRunning)stopCamera();if(!voice&&voiceRunning)stopVoice();status(voice?'已切換至語音簽到。':'已切換至身分證掃描。');}
$('voiceTab').onclick=()=>switchMode('voice');$('scanTab').onclick=()=>switchMode('scan');
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('此手機瀏覽器不支援內建語音辨識。請使用最新版 Android Chrome，或改用身分證掃描。','bad');return;}
 try{recognition=new SR();recognition.lang='zh-TW';recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=5;recognition.onstart=()=>{voiceRunning=true;$('voiceOrb').classList.add('live');$('voiceStart').hidden=true;$('voiceStop').hidden=false;$('recognized').textContent='正在聆聽…';status('麥克風已啟動，請說出教師姓名。','good');};recognition.onresult=e=>{let finalText='',alts=[];for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){finalText+=r[0].transcript;for(let j=0;j<r.length;j++)alts.push(r[j].transcript);}}if(finalText.trim()){const text=finalText.trim();$('recognized').textContent='辨識結果：'+text;submitFields({mode:'phoneVoiceSubmit',voiceText:text,candidates:JSON.stringify([...new Set(alts.map(x=>String(x||'').trim()).filter(Boolean))].slice(0,5))});status('語音結果已傳回電腦，請在電腦畫面核對教師姓名及簽到狀態。','good');stopVoice();}};recognition.onerror=e=>{status('語音辨識失敗：'+(e.error||'未知錯誤')+'。請檢查麥克風權限後重試。','bad');stopVoice();};recognition.onend=()=>{voiceRunning=false;$('voiceOrb').classList.remove('live');$('voiceStart').hidden=false;$('voiceStop').hidden=true;};recognition.start();}catch(e){status('無法啟動語音辨識：'+(e.message||e),'bad');stopVoice();}}
function stopVoice(){try{if(recognition)recognition.stop();}catch(e){}voiceRunning=false;$('voiceOrb').classList.remove('live');$('voiceStart').hidden=false;$('voiceStop').hidden=true;}
$('voiceStart').onclick=startVoice;$('voiceStop').onclick=stopVoice;
function hexToBytes(hex){const a=new Uint8Array(hex.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(hex.slice(i*2,i*2+2),16);return a;}
function bytesToBase64(bytes){let b='';for(let i=0;i<bytes.length;i++)b+=String.fromCharCode(bytes[i]);return btoa(b);}
function extractId(raw){const m=String(raw||'').normalize('NFKC').toUpperCase().match(/[A-Z][12]\d{8}/);return m?m[0]:'';}
function validId(id){const map={A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33};if(!/^[A-Z][12]\d{8}$/.test(id)||!map[id[0]])return false;const n=map[id[0]],digits=[Math.floor(n/10),n%10,...id.slice(1).split('').map(Number)],weights=[1,9,8,7,6,5,4,3,2,1,1];return digits.reduce((s,d,i)=>s+d*weights[i],0)%10===0;}
async function encryptId(id){if(!crypto?.subtle)throw new Error('手機瀏覽器不支援安全加密。');const iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey('raw',hexToBytes(keyHex),{name:'AES-GCM'},false,['encrypt']),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(id));return{iv:Array.from(iv,b=>b.toString(16).padStart(2,'0')).join(''),ciphertext:bytesToBase64(new Uint8Array(cipher))};}
async function stopCamera(){
 if(scanner){
  try{if(typeof scanner.stop==='function')await scanner.stop();}catch(e){}
  scanner=null;
 }
 const video=$('reader').querySelector('video');
 if(video&&video.srcObject){
  try{video.srcObject.getTracks().forEach(track=>track.stop());}catch(e){}
  video.srcObject=null;
 }
 scannerRunning=false;
 if(scanDiagTimer){clearInterval(scanDiagTimer);scanDiagTimer=null;}
}
async function startCamera(){
 if(!window.ZXingBrowser||!ZXingBrowser.BrowserMultiFormatReader){
  status('ZXing 解碼元件載入失敗。請確認網路連線後重新整理頁面。','bad');return;
 }
 if(scannerRunning)await stopCamera();
 const video=document.createElement('video');
 video.setAttribute('playsinline','true');
 video.setAttribute('autoplay','true');
 video.muted=true;
 video.style.width='100%';
 video.style.height='auto';
 video.style.maxHeight='58vh';
 video.style.objectFit='contain';
 $('reader').replaceChildren(video);
 try{
  // 直接使用 ZXing Browser，不再經過 html5-qrcode 的解碼封裝。
  const formats=[
   ZXingBrowser.BarcodeFormat.PDF_417,
   ZXingBrowser.BarcodeFormat.CODE_39,
   ZXingBrowser.BarcodeFormat.CODE_128,
   ZXingBrowser.BarcodeFormat.CODE_93,
   ZXingBrowser.BarcodeFormat.CODABAR,
   ZXingBrowser.BarcodeFormat.ITF
  ].filter(x=>x!==undefined);
  const hints=new Map();
  if(ZXingBrowser.DecodeHintType&&ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS){
   hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,formats);
  }
  const reader=new ZXingBrowser.BrowserMultiFormatReader(hints);
  scanner=reader;
  decodeCount=0;scanStartedAt=Date.now();
  const constraints={
   audio:false,
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1920},
    height:{ideal:1080}
   }
  };
  const controls=await reader.decodeFromConstraints(constraints,video,(result,error)=>{
   if(!scannerRunning)return;
   if(result){
    const raw=typeof result.getText==='function'?result.getText():String(result.text||'');
    onScan(raw,result);
   }else if(error){
    const name=String(error.name||'');
    if(name&&name!=='NotFoundException'&&name!=='ChecksumException'&&name!=='FormatException'){
     console.warn('ZXing decode diagnostic:',error);
    }
   }
  });
  scanner=controls;
  scannerRunning=true;scanBusy=false;scanStartedAt=Date.now();
  $('scanStart').hidden=true;$('scanNext').hidden=true;
  const w=video.videoWidth||0,h=video.videoHeight||0;
  status(`相機已啟動（${w}×${h}），已直接使用 ZXing 解碼器。請讓身分證背面條碼完整入鏡、橫向對準並保持穩定。`,'good');
  scanDiagTimer=setInterval(()=>{
   if(!scannerRunning)return;
   const vw=video.videoWidth||0,vh=video.videoHeight||0,sec=Math.floor((Date.now()-scanStartedAt)/1000);
   if(decodeCount===0&&sec>=10&&sec%10===0){
    status(`影像串流正常（${vw}×${vh}），ZXing 已掃描 ${sec} 秒，尚未成功讀取。請確認條碼完整、清晰、無反光，並嘗試移近或調整角度。`,'bad');
   }
  },1000);
 }catch(e){
  await stopCamera();
  status('相機／ZXing 啟動失敗：'+(e.message||e)+'。請確認相機權限及 HTTPS 連線。','bad');
 }
}
async function onScan(raw,decodedResult){
 if(scanBusy)return;
 decodeCount++;
 const id=extractId(raw);
 if(!id||!validId(id)){
  status(`已讀取到條碼，但內容不符合身分證格式（辨識長度 ${String(raw||'').length}）。請調整角度再試；不要截圖或傳送完整條碼內容。`,'bad');
  return;
 }
 scanBusy=true;
 try{
  const encrypted=await encryptId(id);
  submitFields({mode:'phoneScanSubmit',iv:encrypted.iv,ciphertext:encrypted.ciphertext});
  status('已辨識並加密傳送身分證資料。請查看電腦主畫面確認簽到結果。','good');
  await stopCamera();
  $('scanNext').hidden=false;$('scanStart').hidden=true;
 }catch(e){
  scanBusy=false;
  status('加密或傳送失敗：'+(e.message||e),'bad');
 }
}
$('scanStart').onclick=startCamera;$('scanNext').onclick=()=>{scanBusy=false;startCamera();};$('scanStop').onclick=async()=>{await stopCamera();scanBusy=true;$('scanStart').hidden=false;$('scanNext').hidden=true;status('已結束相機掃描。');};
if(!validParams()){['voiceStart','scanStart'].forEach(id=>$(id).disabled=true);status('配對資訊無效或已過期，請回到電腦重新產生 QR Code。','bad');}else if(!navigator.mediaDevices?.getUserMedia){$('scanStart').disabled=true;status('此瀏覽器不支援相機存取；仍可嘗試語音模式。','bad');}else status('已完成電腦配對。請選擇語音簽到或身分證掃描。','good');
try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}window.addEventListener('pagehide',()=>{stopCamera();stopVoice();});
})();
</script></body></html>
