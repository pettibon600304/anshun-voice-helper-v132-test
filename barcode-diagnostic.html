<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>教師活動簽到｜獨立條碼解碼測試</title>
<style>
:root{--navy:#17324d;--green:#16734a;--red:#b42318;--line:#dbe3ea}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f6f9;color:#172b45;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #162a3c14}
h1{font-size:21px;color:var(--navy);margin:0 0 8px}
p{line-height:1.6;color:#475569}
video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#111;border-radius:12px;margin:12px 0}
button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--navy);color:white;font-size:16px;font-weight:700;margin-top:9px}
button.secondary{background:#edf2f7;color:#263a50;border:1px solid #d8e0e9}
#status{white-space:pre-wrap;line-height:1.6;padding:12px;border-radius:10px;background:#f2f6fa;margin-top:12px}
#status.good{background:#e8f5ee;color:#17633d}
#status.bad{background:#fff0ef;color:#a32119}
.small{font-size:12px;color:#64748b}
</style>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>
<body>
<main>
  <h1>獨立條碼解碼測試</h1>
  <p>這是獨立診斷頁，不會連接教師名冊、不會傳送資料，也不會保存照片。請先用一般商品條碼測試，不要用身分證測試。</p>
  <video id="video" muted playsinline></video>
  <button id="start">啟動獨立解碼測試</button>
  <button id="stop" class="secondary" disabled>停止測試</button>
  <div id="status" role="status" aria-live="polite">等待啟動。請使用 HTTPS 的 Google Chrome。</div>
  <p class="small">測試引擎：ZXing BrowserMultiFormatReader。成功時只顯示條碼格式；一般商品條碼內容會遮蔽部分數字，疑似身分證字號則完全不顯示。</p>
</main>
<script>
(function(){
'use strict';
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
const stopBtn=document.getElementById('stop');
let reader=null,controls=null,running=false,found=false;

function setStatus(message,kind){
  statusEl.textContent=message;
  statusEl.className=kind||'';
}
function safeValue(value){
  const s=String(value||'').trim().toUpperCase();
  if(/[A-Z][12]\d{8}/.test(s)) return '疑似個人識別資料（已隱藏）';
  if(s.length<=4) return '已讀取（內容不顯示）';
  return s.slice(0,2)+'••••'+s.slice(-2)+'（部分遮蔽）';
}
async function stopTest(){
  running=false;
  try{if(controls) controls.stop();}catch(e){}
  controls=null;
  try{
    const stream=video.srcObject;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    video.srcObject=null;
  }catch(e){}
  try{if(reader) reader.reset();}catch(e){}
  stopBtn.disabled=true;
  startBtn.disabled=false;
}
async function startTest(){
  if(!window.ZXing || !ZXing.BrowserMultiFormatReader){
    setStatus('ZXing 測試元件載入失敗。\n請確認手機網路可連線，重新整理後再試。','bad');
    return;
  }
  await stopTest();
  found=false;
  startBtn.disabled=true;
  setStatus('正在啟動相機及獨立 ZXing 解碼器…');

  try{
    const hints=new Map();
    const formats=[
      ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.PDF_417,
      ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.AZTEC
    ].filter(x=>x!==undefined);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    if(ZXing.DecodeHintType.ALSO_INVERTED!==undefined){
      hints.set(ZXing.DecodeHintType.ALSO_INVERTED,true);
    }

    reader=new ZXing.BrowserMultiFormatReader(hints,350);
    running=true;
    stopBtn.disabled=false;

    controls=await reader.decodeFromVideoDevice(
      undefined,
      video,
      (result,error)=>{
        if(!running || !result || found) return;
        found=true;
        const format=result.getBarcodeFormat
          ? ZXing.BarcodeFormat[result.getBarcodeFormat()]
          : '未知格式';
        const value=safeValue(result.getText ? result.getText() : '');
        setStatus(
          '獨立解碼成功！\n條碼格式：'+format+
          '\n讀取結果：'+value+
          '\n\n這表示手機相機影像可被另一套 ZXing 解碼器辨識。',
          'good'
        );
      }
    );
    setStatus(
      '相機已啟動，獨立解碼器正在掃描。\n\n'+
      '請把清晰的商品條碼完整放入畫面，保持手機穩定並等待 10 秒。\n'+
      '請勿使用身分證進行這項測試。'
    );
  }catch(e){
    running=false;
    setStatus('獨立解碼器啟動失敗：'+(e&&e.message?e.message:String(e)),'bad');
    await stopTest();
  }
}
startBtn.addEventListener('click',startTest);
stopBtn.addEventListener('click',async()=>{
  await stopTest();
  setStatus('測試已停止。');
});
window.addEventListener('pagehide',()=>{stopTest();});
})();
</script>
</body>
</html>
