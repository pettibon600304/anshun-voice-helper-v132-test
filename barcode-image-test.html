<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>條碼照片解碼測試</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f6f9;color:#172b45;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:auto;background:white;border:1px solid #dbe3ea;border-radius:18px;padding:18px}
h1{font-size:21px;color:#17324d;margin:0 0 8px}p{line-height:1.6;color:#475569}
button,.filelabel{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:#17324d;color:white;font-size:16px;font-weight:700;margin-top:10px;text-align:center}
input[type=file]{display:none}button:disabled{opacity:.45}
#preview{display:none;width:100%;max-height:55vh;object-fit:contain;background:#111;border-radius:12px;margin-top:12px}
#status{white-space:pre-wrap;line-height:1.6;padding:12px;border-radius:10px;background:#f2f6fa;margin-top:12px}
#status.good{background:#e8f5ee;color:#17633d}#status.bad{background:#fff0ef;color:#a32119}
.small{font-size:12px;color:#64748b}
</style>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>
<body>
<main>
<h1>條碼照片解碼測試</h1>
<p>請先用手機原生相機拍攝一般商品包裝上的條碼，再從下方選取照片。本頁只在手機瀏覽器本機處理照片，不會上傳照片，也不會連接教師名冊。</p>
<label class="filelabel" for="photo">選取商品條碼照片</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="所選條碼照片預覽">
<button id="decode" disabled>開始照片解碼</button>
<button id="clear" type="button" style="background:#edf2f7;color:#263a50">清除照片</button>
<div id="status" role="status" aria-live="polite">等待選取照片。請勿使用身分證照片進行測試。</div>
<p class="small">成功時只顯示條碼格式及遮蔽後的商品條碼內容。請不要選取身分證或含個人資料的照片。</p>
</main>
<script>
(function(){
'use strict';
const fileInput=document.getElementById('photo');
const preview=document.getElementById('preview');
const decodeBtn=document.getElementById('decode');
const clearBtn=document.getElementById('clear');
const status=document.getElementById('status');
let objectUrl='';
function say(t,k){status.textContent=t;status.className=k||'';}
function safeValue(v){
 const s=String(v||'').trim().toUpperCase();
 if(/[A-Z][12]\d{8}/.test(s)) return '疑似個人識別資料（已隱藏）';
 if(s.length<=4) return '已讀取（內容不顯示）';
 return s.slice(0,2)+'••••'+s.slice(-2)+'（部分遮蔽）';
}
fileInput.addEventListener('change',()=>{
 const f=fileInput.files&&fileInput.files[0];
 if(!f)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(f);
 preview.onload=()=>{
  decodeBtn.disabled=false;
  say('照片已載入。影像尺寸：'+preview.naturalWidth+' × '+preview.naturalHeight+'。請按「開始照片解碼」。');
 };
 preview.src=objectUrl;
 preview.style.display='block';
});
decodeBtn.addEventListener('click',()=>{
 if(!window.ZXing||!ZXing.BrowserMultiFormatReader){
  say('ZXing 元件載入失敗，請確認網路連線並重新整理。','bad');return;
 }
 decodeBtn.disabled=true;
 say('正在使用照片直接解碼…');
 try{
  const hints=new Map();
  const formats=[
   ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,
   ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,
   ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
   ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.ITF,
   ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.PDF_417,
   ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX,
   ZXing.BarcodeFormat.AZTEC
  ].filter(x=>x!==undefined);
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,formats);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const reader=new ZXing.BrowserMultiFormatReader(hints);
  const result=reader.decodeFromImageElement(preview);
  const fmt=ZXing.BarcodeFormat[result.getBarcodeFormat()]||'未知格式';
  say('照片解碼成功！\n條碼格式：'+fmt+'\n讀取結果：'+safeValue(result.getText())+'\n\n代表靜態照片可以被 ZXing 解碼。','good');
 }catch(e){
  const msg=e&&e.message?e.message:String(e);
  say('照片解碼未成功。\n錯誤訊息：'+msg+'\n\n請確認照片中商品條碼完整、清晰、沒有反光，且條碼四周留有白色空間。','bad');
 }finally{
  decodeBtn.disabled=false;
 }
});
clearBtn.addEventListener('click',()=>{
 fileInput.value='';
 preview.removeAttribute('src');
 preview.style.display='none';
 decodeBtn.disabled=true;
 if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl='';}
 say('已清除照片，等待重新測試。');
});
window.addEventListener('pagehide',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);});
})();
</script>
</body>
</html>
